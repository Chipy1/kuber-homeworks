apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "webapp.fullname" . }}-frontend-index
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  index.html: |
    <html>
      <head><title>{{ .Release.Name }}</title></head>
      <body>
        <h1>release: {{ .Release.Name }}</h1>
        <h2>namespace: {{ .Release.Namespace }}</h2>
        <h2>frontend image: {{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}</h2>
        <h2>backend service: {{ include "webapp.fullname" . }}-backend:{{ .Values.backend.service.port }}</h2>
      </body>
    </html>
