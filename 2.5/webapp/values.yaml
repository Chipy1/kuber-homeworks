# Общие настройки чарта
nameOverride: ""
fullnameOverride: ""

frontend:
  replicaCount: 1
  image:
    repository: nginx
    tag: "1.19"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources: {}

backend:
  replicaCount: 1
  image:
    repository: wbitt/network-multitool
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources: {}
