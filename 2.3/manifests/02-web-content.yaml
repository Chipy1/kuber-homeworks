apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content
  namespace: hw23
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <title>Netology. Kubernetes homework 2.3</title>
      <style>
        body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
               background: #0f172a; color: #e2e8f0; }
        .wrap { max-width: 720px; margin: 0 auto; padding: 64px 24px; }
        .card { border: 1px solid #1e293b; border-radius: 12px;
                padding: 28px 32px; background: #111c33; }
        h1 { margin: 0 0 12px; font-size: 1.9rem; }
        p  { margin: 8px 0 0; line-height: 1.6; color: #94a3b8; }
        code { color: #7dd3fc; }
      </style>
    </head>
    <body>
      <div class="wrap">
        <div class="card">
          <h1>Netology. Kubernetes homework 2.3</h1>
          <p>Эту страницу nginx отдаёт из ConfigMap <code>web-content</code>.</p>
          <p>Файл примонтирован через subPath, поэтому каталог
             <code>/usr/share/nginx/html</code> остался на месте.</p>
        </div>
      </div>
    </body>
    </html>
