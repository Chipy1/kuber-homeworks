apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-web
  namespace: hw23
  labels:
    app: secure-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-web
  template:
    metadata:
      labels:
        app: secure-web
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: secure-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: secure-content
          configMap:
            name: secure-content
