apiVersion: apps/v1
kind: Deployment
metadata:
  name: netology-deploy
  namespace: hw13
  labels:
    app: netology
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netology
  template:
    metadata:
      labels:
        app: netology
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - name: http
              containerPort: 80
        - name: multitool
          image: wbitt/network-multitool
          ports:
            - name: http
              containerPort: 80
