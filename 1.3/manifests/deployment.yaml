apiVersion: apps/v1
kind: Deployment
metadata:
  name: netology-deploy
  namespace: hw13
  labels:
    app: netology
spec:
  # после масштабирования через kubectl scale значение приведено к фактическому
  replicas: 2
  selector:
    matchLabels:
      app: netology
  template:
    metadata:
      labels:
        app: netology
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - name: http
              containerPort: 80
        - name: multitool
          image: wbitt/network-multitool
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: HTTPS_PORT
              value: "8443"
          ports:
            - name: http-mt
              containerPort: 8080
            - name: https-mt
              containerPort: 8443
