# CertificateSigningRequest для пользователя netology-user.
# request — base64 от netology-user.csr (PKCS#10). Подписывается CA кластера
# через CSR API, приватный ключ CA не нужен.
apiVersion: certificates.k8s.io/v1
kind: CertificateSigningRequest
metadata:
  name: netology-user
spec:
  request: 
  signerName: kubernetes.io/kube-apiserver-client
  usages:
    - client auth
