apiVersion: v1
kind: Pod
metadata:
  name: demo-pod
  namespace: hw24
  labels:
    app: demo-pod
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
