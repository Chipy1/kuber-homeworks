apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: hw24
rules:
  # сам объект Pod: нужен для get pods и для describe (describe читает Pod через get)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # логи подов: это отдельный субресурс, право на pods его не покрывает
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  # события namespace: без них describe показывает пустую секцию Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
