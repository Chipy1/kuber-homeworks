apiVersion: v1
kind: ServiceAccount
metadata:
  name: hw22-nfs-provisioner
  namespace: hw22
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hw22-nfs-provisioner-runner
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hw22-nfs-provisioner-runner
subjects:
  - kind: ServiceAccount
    name: hw22-nfs-provisioner
    namespace: hw22
roleRef:
  kind: ClusterRole
  name: hw22-nfs-provisioner-runner
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hw22-nfs-provisioner
  namespace: hw22
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hw22-nfs-provisioner
  namespace: hw22
subjects:
  - kind: ServiceAccount
    name: hw22-nfs-provisioner
    namespace: hw22
roleRef:
  kind: Role
  name: hw22-nfs-provisioner
  apiGroup: rbac.authorization.k8s.io
