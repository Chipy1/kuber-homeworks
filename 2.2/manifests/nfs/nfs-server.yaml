apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server
  namespace: hw22
  labels:
    app: nfs-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfs-server
  template:
    metadata:
      labels:
        app: nfs-server
    spec:
      containers:
        - name: nfs-server
          image: itsthenetwork/nfs-server-alpine:12
          env:
            - name: SHARED_DIRECTORY
              value: "/exports"
          ports:
            - name: nfs
              containerPort: 2049
          securityContext:
            privileged: true
          volumeMounts:
            - name: nfs-store
              mountPath: /exports
      volumes:
        - name: nfs-store
          hostPath:
            path: /var/snap/microk8s/common/hw22-nfs
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  namespace: hw22
spec:
  # IP зафиксирован намеренно: kubelet монтирует NFS из сетевого namespace хоста,
  # где имя nfs-server.hw22.svc.cluster.local не резолвится (см. solution.md).
  clusterIP: 10.152.183.56
  selector:
    app: nfs-server
  ports:
    - name: nfs
      port: 2049
      targetPort: 2049
