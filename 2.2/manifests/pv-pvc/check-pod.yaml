apiVersion: v1
kind: Pod
metadata:
  name: hw22-check
  namespace: hw22
  labels:
    app: hw22-check
spec:
  restartPolicy: Never
  containers:
    - name: check
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - sleep 3600
      volumeMounts:
        - name: host-data
          mountPath: /host-data
          readOnly: true
  volumes:
    - name: host-data
      hostPath:
        path: /var/snap/microk8s/common/hw22-data
        type: Directory
