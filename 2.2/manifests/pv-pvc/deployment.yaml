apiVersion: apps/v1
kind: Deployment
metadata:
  name: hw22-local
  namespace: hw22
  labels:
    app: hw22-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hw22-local
  template:
    metadata:
      labels:
        app: hw22-local
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                echo "$(date -Iseconds) запись от busybox" >> /shared/data.txt
                sleep 5
              done
          volumeMounts:
            - name: shared
              mountPath: /shared
        - name: multitool
          image: wbitt/network-multitool
          command:
            - /bin/sh
            - -c
            - tail -n +1 -f /shared/data.txt
          volumeMounts:
            - name: shared
              mountPath: /shared
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: hw22-pvc
