apiVersion: v1
kind: Service
metadata:
  name: netology-svc
  namespace: hw14
spec:
  type: ClusterIP
  selector:
    app: netology-app
  ports:
    - name: nginx
      port: 9001
      targetPort: 80
      protocol: TCP
    - name: multitool
      port: 9002
      targetPort: 8080
      protocol: TCP
