apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-v2
  namespace: hw34
  labels:
    app: web-v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-v2
  template:
    metadata:
      labels:
        app: web-v2
    spec:
      containers:
        - name: nginx
          image: nginx:1.20
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
      volumes:
        - name: page
          configMap:
            name: web-v2-page
---
apiVersion: v1
kind: Service
metadata:
  name: web-v2
  namespace: hw34
  labels:
    app: web-v2
spec:
  selector:
    app: web-v2
  ports:
    - name: http
      port: 80
      targetPort: 80
